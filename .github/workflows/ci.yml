name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Deps
        run: |
          # Some transitive deps (e.g. @electron/node-gyp) are locked with a
          # git+ssh:// resolved URL; rewrite to HTTPS so `yarn install` can fetch
          # them on runners without SSH keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          yarn install

      - name: Run Tests
        run: yarn run test

      - name: Compile
        run: yarn run prod

      - name: Run Linter
        run: yarn run lint

      - name: Run Type-checking for Tests
        run: yarn run test:typecheck
