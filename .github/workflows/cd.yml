name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Deps
        run: |
          # Some transitive deps (e.g. @electron/node-gyp) are locked with a
          # git+ssh:// resolved URL; rewrite to HTTPS so `yarn install` can fetch
          # them on runners without SSH keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          yarn install

      - name: Compile
        run: yarn run prod

      - name: Package App and Draft New Release
        run: yarn run cd:package-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Deps
        run: |
          # Some transitive deps (e.g. @electron/node-gyp) are locked with a
          # git+ssh:// resolved URL; rewrite to HTTPS so `yarn install` can fetch
          # them on runners without SSH keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          yarn install

      - name: Compile
        run: yarn run prod

      - name: Package App and Draft New Release
        run: yarn run cd:package-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  darwin:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Deps
        run: |
          # Some transitive deps (e.g. @electron/node-gyp) are locked with a
          # git+ssh:// resolved URL; rewrite to HTTPS so `yarn install` can fetch
          # them on runners without SSH keys.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          yarn install

      - name: Compile
        run: yarn run prod

      - name: Package App and Draft New Release
        run: yarn run cd:package-draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
